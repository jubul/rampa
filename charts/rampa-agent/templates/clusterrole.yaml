{{- if .Values.rbac.create }}
# Permisos del agente de Rampa. Son amplios a propósito: el agente es el brazo
# del plano de control dentro del cluster y crea o borra namespaces completos
# (un scope de una app es un namespace <app>-<scope>). Cada bloque explica para
# qué se usa. La lista razonada también está en docs/instalar-agente.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rampa-agent.fullname" . }}
  labels:
    {{- include "rampa-agent.labels" . | nindent 4 }}
rules:
  # Namespaces: cada scope vive en su propio namespace <app>-<scope>.
  # ensureNamespace y ensureAppNamespace (deploy y write_secret) hacen get,
  # create y update de labels; Undeploy hace get y delete. No se usa list.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, create, update, delete]

  # Workloads de las apps: Deployment (strategy rolling), Rollout de Argo
  # Rollouts (canary o bluegreen; si el cluster no lo tiene, la regla no
  # molesta) y CronJob (apps de tipo cron). Deploy aplica con server-side apply
  # (patch, y create cuando el objeto no existe), workload.go hace get para
  # observarlos y prune hace list y delete. No hay Jobs ni watch en el agente.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [argoproj.io]
    resources: [rollouts]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, create, patch, delete]

  # ReplicaSets: solo list (workload.go). Sirven para identificar la revisión
  # nueva de un Deployment y observar solo sus pods durante el rollout, así un
  # pod viejo en CrashLoopBackOff no hace fallar el deploy que lo arregla.
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [list]

  # Objetos de namespace que genera el chart rampa-app: Service, ServiceAccount
  # (identidad de nube por app), ResourceQuota (scopes efímeros), Ingress, HPA
  # y PDB. Deploy los aplica con server-side apply (create y patch) y prune
  # hace list y delete de lo que ya no está en el render. Nunca se leen por get.
  - apiGroups: [""]
    resources: [services, serviceaccounts, resourcequotas]
    verbs: [list, create, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [list, create, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list, create, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [list, create, patch, delete]

  # External Secrets: ExternalSecret trae los parameters secretos de cada app
  # desde el secret manager de la nube (apply y prune, igual que lo anterior).
  # Si el cluster no tiene ESO instalado, la regla no molesta. El agente no
  # toca el ClusterSecretStore: lo instala Helm con este chart.
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    verbs: [list, create, patch, delete]

  # Pods: solo list (workload.go y logs.go). Para saber por qué un rollout no
  # avanza (ImagePullBackOff, CrashLoopBackOff) y elegir el pod del comando
  # "logs". El agente nunca crea ni borra pods.
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]

  # Logs de pods: solo get (Pods().GetLogs en logs.go) para el tail hacia la web.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]

  # Nodos: solo list (Client.NodeCount) para contar cuántos hay en el
  # heartbeat. Es informativo: sin la regla el agente reporta nodes: 0.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]

{{- if .Values.rbac.appSecrets }}

  # Secrets de las apps: el comando write_secret con target kubernetes hace
  # get, create y update del Secret <app>-params (secret.go). Lo usa un cluster
  # con secret_store: kubernetes (VMs con k3s, nubes sin gestor de secretos).
  #
  # Alcance real: a nivel cluster, get permite leer CUALQUIER Secret de
  # CUALQUIER namespace si se conoce su nombre, y create/update permite
  # escribirlos. Lo que lo acota es el código del agente (exige namespace
  # <app>-<scope> con la label rampa.dev/app de la app, no toca namespaces del
  # sistema ni Secrets de otro tipo, de otro administrador o de External
  # Secrets) y que no hay list ni watch: no se pueden enumerar. RBAC por sí
  # solo no impone esa restricción. Si tu cluster usa un gestor de secretos de
  # nube vía ESO, rbac.appSecrets=false quita esta regla y el agente no tiene
  # ningún permiso sobre secrets.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update]
{{- end }}
{{- end }}
