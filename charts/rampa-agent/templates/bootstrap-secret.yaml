{{- include "rampa-agent.validate" . }}
{{- if .Values.cluster.bootstrapToken }}
# Bootstrap token de un solo uso. El agente lo canjea al arrancar por el token
# real del cluster y guarda ese token en el Secret rampa-agent-token de este
# namespace. Después del primer arranque este Secret ya no sirve para nada
# (el canje lo invalida) y se puede borrar; el Deployment lo referencia como
# optional para que el pod siga arrancando sin él.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rampa-agent.bootstrapSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rampa-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  bootstrap_token: {{ .Values.cluster.bootstrapToken | quote }}
{{- end }}
