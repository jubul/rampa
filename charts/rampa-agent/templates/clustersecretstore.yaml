{{- if .Values.secretStore.enabled }}
{{- $ss := .Values.secretStore }}
# ClusterSecretStore hacia el secret manager de la nube. Requiere External
# Secrets Operator instalado en el cluster (este chart no lo instala).
# La autenticación es por serviceAccountRef al SA del agente: la identidad de
# nube del SA tiene que poder leer secretos con prefijo rampa/.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $ss.name }}
  labels:
    {{- include "rampa-agent.labels" . | nindent 4 }}
spec:
  provider:
    {{- if eq $ss.provider "aws" }}
    aws:
      service: SecretsManager
      region: {{ required "secretStore.aws.region es requerido con provider aws" $ss.aws.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "rampa-agent.serviceAccountName" . }}
            namespace: {{ .Release.Namespace }}
    {{- else if eq $ss.provider "gcp" }}
    gcpsm:
      projectID: {{ required "secretStore.gcp.projectID es requerido con provider gcp" $ss.gcp.projectID | quote }}
      auth:
        workloadIdentity:
          clusterLocation: {{ required "secretStore.gcp.clusterLocation es requerido con provider gcp" $ss.gcp.clusterLocation | quote }}
          clusterName: {{ required "secretStore.gcp.clusterName es requerido con provider gcp" $ss.gcp.clusterName | quote }}
          clusterProjectID: {{ $ss.gcp.projectID | quote }}
          serviceAccountRef:
            name: {{ include "rampa-agent.serviceAccountName" . }}
            namespace: {{ .Release.Namespace }}
    {{- else if eq $ss.provider "azure" }}
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ required "secretStore.azure.vaultURL es requerido con provider azure" $ss.azure.vaultURL | quote }}
      tenantId: {{ required "secretStore.azure.tenantID es requerido con provider azure" $ss.azure.tenantID | quote }}
      serviceAccountRef:
        name: {{ include "rampa-agent.serviceAccountName" . }}
        namespace: {{ .Release.Namespace }}
    {{- else }}
    {{- fail (printf "secretStore.provider %q no es válido. Opciones: aws, gcp, azure" $ss.provider) }}
    {{- end }}
{{- end }}
