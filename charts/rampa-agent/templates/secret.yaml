{{- include "rampa-agent.validate" . }}
{{- if not .Values.cluster.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rampa-agent.tokenSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rampa-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.cluster.secretKey | default "token" }}: {{ .Values.cluster.token | quote }}
{{- end }}
