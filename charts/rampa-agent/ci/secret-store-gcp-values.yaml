# ClusterSecretStore hacia GCP Secret Manager con Workload Identity (GKE).
api:
  url: https://api.rampa.dev
cluster:
  token: rampa_cluster_ci_0000000000000000000000000000
serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: rampa-agent@mi-proyecto.iam.gserviceaccount.com
secretStore:
  enabled: true
  name: gcp-secret-manager
  provider: gcp
  gcp:
    projectID: mi-proyecto
    clusterLocation: us-central1
    clusterName: gke-nonprod
