# Token administrado por el cliente en un Secret propio, SA con IRSA (EKS),
# PriorityClass alta y tolerancias para correr en nodos del sistema.
api:
  url: https://api.rampa.dev
cluster:
  existingSecret: rampa-agent-token
  secretKey: token
image:
  tag: 0.1.0-rc1
  pullPolicy: Always
serviceAccount:
  create: true
  name: rampa-agent
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/rampa-agent
logLevel: debug
priorityClassName: system-cluster-critical
podAnnotations:
  rampa.dev/managed-by-team: platform
nodeSelector:
  kubernetes.io/os: linux
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
extraEnv:
  - name: HTTPS_PROXY
    value: http://proxy.interno:3128
