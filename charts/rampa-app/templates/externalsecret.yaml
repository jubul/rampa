{{- if .Values.secrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "rampa.name" . }}-params
  labels:
    {{- include "rampa.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.cluster.secretStore }}
  target:
    name: {{ include "rampa.name" . }}-params
    creationPolicy: Owner
  data:
    {{- range .Values.secrets }}
    - secretKey: {{ .name | quote }}
      remoteRef:
        key: {{ required "secrets[].remoteKey es requerido" .remoteKey | quote }}
        {{- with .property }}
        property: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
